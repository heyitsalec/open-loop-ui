name: Feature request
description: Suggest an improvement or adapter idea.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Open Loop UI do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core UI
        - Adapter contract
        - Documentation
        - Example app
        - Accessibility
        - Theming
